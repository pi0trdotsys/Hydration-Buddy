name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nowy push do tej samej gałęzi anuluje poprzedni, jeszcze trwający bieg.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Testy, lint i build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Testy jednostkowe (w tym testy interfejsu Compose na Robolectric), lint i build debug.
      # Bez keystore.properties build podpisuje kluczem debug — wystarczy do sprawdzenia, że się składa.
      - name: Test, lint, assembleDebug
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Raporty z testów i lintu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raporty
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: kropi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Testy na prawdziwej bazie i DataStore (cofanie, kopie zapasowe, akcje widgetu) na emulatorze.
  instrumented:
    name: Testy na emulatorze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Wolne, więc tylko po wejściu zmian do main albo na życzenie — nie przy każdym PR.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Włącz KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --stacktrace
